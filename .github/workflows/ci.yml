name: Build and deploy benchmark app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_DIR: /opt/apps/application-benchmark
  REPO_URL: github-benchmark-app:your-org/application-benchmark.git

jobs:
  build:
    name: Build Docker app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create nginx-proxy-manager_default || true

      - name: Build image
        run: docker compose build

      - name: Start app
        run: docker compose up -d

      - name: Check app is running
        run: |
          APP_READY=false

          for i in {1..30}; do
            if docker compose exec -T benchmark-app node -e "
              const net = require('net');
              const socket = net.connect(3000, '127.0.0.1', () => {
                socket.end();
                process.exit(0);
              });
              socket.on('error', () => process.exit(1));
              setTimeout(() => process.exit(1), 2000);
            "; then
              APP_READY=true
              break
            fi

            sleep 2
          done

          if [ "$APP_READY" != "true" ]; then
            echo "The benchmark app did not start properly"
            docker compose logs benchmark-app
            exit 1
          fi

      - name: Show containers
        run: docker compose ps

      - name: Clean up
        if: always()
        run: docker compose down

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # The real server and deploy key are stored in GitHub Secrets.
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            cat > ~/.ssh/benchmark_deploy_key <<'EOF'
            ${{ secrets.BENCHMARK_DEPLOY_KEY }}
            EOF

            chmod 600 ~/.ssh/benchmark_deploy_key

            cat > ~/.ssh/config <<'EOF'
            Host github-benchmark-app
                HostName github.com
                User git
                IdentityFile ~/.ssh/benchmark_deploy_key
                IdentitiesOnly yes
            EOF

            chmod 600 ~/.ssh/config
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
              mkdir -p "${{ env.APP_DIR }}"
              git clone "${{ env.REPO_URL }}" "${{ env.APP_DIR }}"
            fi

            cd "${{ env.APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main

            # Rebuild the container with the latest code and start it again.
            docker compose build
            docker compose up -d

            APP_READY=false

            for i in {1..30}; do
              if docker compose exec -T benchmark-app node -e "
                const net = require('net');
                const socket = net.connect(3000, '127.0.0.1', () => {
                  socket.end();
                  process.exit(0);
                });
                socket.on('error', () => process.exit(1));
                setTimeout(() => process.exit(1), 2000);
              "; then
                APP_READY=true
                break
              fi

              sleep 2
            done

            if [ "$APP_READY" != "true" ]; then
              echo "The benchmark app did not start properly"
              docker compose logs benchmark-app
              exit 1
            fi

            docker compose ps
